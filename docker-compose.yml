# zahialga• ERP V2 — Cloud.mn сервер дээр ажиллах бүрэн тохиргоо
# Анх: ./install.sh   Шинэчлэх: ./update.sh
# Аудит А10: бүртгэл (log) дискийг дүүргэхгүй — үйлчилгээ бүрт 10MB × 5 файл
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?install.sh-ийг ажиллуулна уу}
      POSTGRES_DB: erp
      TZ: Asia/Ulaanbaatar
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Зургийн хавтасны эрхийг апп-ын хэрэглэгч (UID 1001)-д олгоно. Аль контейнер түрүүлж асахаас үл хамааран.
  uploads-init:
    logging: *logging
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "-c", "chown -R 1001:1001 /data && echo uploads-ok"]
    volumes:
      - uploads:/data

  app:
    logging: *logging
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/erp?schema=public&connection_limit=20
      # HTTP (домэйнгүй) үед false байх ёстой, эс бөгөөс браузер нэвтрэлтийн cookie-г хадгалахгүй
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Gmail-ийн нууц үг шифрлэх тогтмол түлхүүр (install.sh / update.sh .env-д бичнэ)
      APP_SECRET: ${APP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      # Барааны зураг (Модуль 1)
      - uploads:/app/data/uploads
      # Нөөц хуулбарын төлөв (зөвхөн унших) — Супер админд анхааруулга (#132)
      - ./backups/.status:/app/data/backup-status:ro
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully

  caddy:
    logging: *logging
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домэйн хоосон бол ":80" — зөвхөн HTTP (IP хаягаар), HTTPS оролдохгүй
      SITE_ADDRESS: ${DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Нөөц хуулбар (#132): өдөр бүр 03:00, шалгалттай; Google Drive холбосон бол тийш ч хуулна (./setup-drive-backup.sh)
  backup:
    logging: *logging
    build:
      context: ./docker
      dockerfile: Dockerfile.backup
    image: zahialga-backup:local
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: erp
      POSTGRES_DB: erp
      TZ: Asia/Ulaanbaatar
      DRIVE_REMOTE: ${DRIVE_REMOTE:-gdrive:zahialga-backup}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
