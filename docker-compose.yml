# zahialga• ERP V2 — Cloud.mn сервер дээр ажиллах бүрэн тохиргоо
# Анх: ./install.sh   Шинэчлэх: ./update.sh
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?install.sh-ийг ажиллуулна уу}
      POSTGRES_DB: erp
      TZ: Asia/Ulaanbaatar
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Зургийн хавтасны эрхийг апп-ын хэрэглэгч (UID 1001)-д олгоно. Аль контейнер түрүүлж асахаас үл хамааран.
  uploads-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "-c", "chown -R 1001:1001 /data && echo uploads-ok"]
    volumes:
      - uploads:/data

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/erp?schema=public&connection_limit=20
      # HTTP (домэйнгүй) үед false байх ёстой, эс бөгөөс браузер нэвтрэлтийн cookie-г хадгалахгүй
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      # Барааны зураг (Модуль 1)
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домэйн хоосон бол ":80" — зөвхөн HTTP (IP хаягаар), HTTPS оролдохгүй
      SITE_ADDRESS: ${DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: erp
      POSTGRES_DB: erp
      TZ: Asia/Ulaanbaatar
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
